name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindbridge.apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Publish APK to web repo
        env:
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
        run: |
          git clone https://x-access-token:${REPO_TOKEN}@github.com/juangcyc-max/mi-portfolio-ia.git web-repo
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk web-repo/public/downloads/mindbridge.apk
          cd web-repo
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add public/downloads/mindbridge.apk
          git commit -m "chore: update mindbridge.apk [skip ci]"
          git push
